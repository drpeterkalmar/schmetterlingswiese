<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffb3d1">
<meta name="description" content="Schmetterlingswiese – ein liebevolles 3D-Flugspiel für Kinder. Fliegen, sammeln, Tierbabys besuchen.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Schmetterlingswiese">
<title>Schmetterlingswiese</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js" } }</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="touch"></div>
<div id="zones"><div class="z zl" data-z="L"><i>◀</i></div><div class="z zr" data-z="R"><i>▶</i></div><div class="z zu" data-z="U"><i>▲</i></div><div class="z zd" data-z="D"><i>▼</i></div></div>
<div id="stick"><div></div></div>
<div id="hud">
  <div class="hudtop"><button id="bPause" class="round" aria-label="Pause">⏸️</button><div id="tasks"></div><div id="timer" class="chip">⏱️ 0</div></div>
  <div id="combo"></div>
  <div id="toast"></div>
  <div id="hint"></div>
  <div id="count"></div>
</div>
<div id="ui"></div>
<noscript><p style="padding:30px;font:20px sans-serif">Bitte JavaScript aktivieren, um die Schmetterlingswiese zu spielen. 🦋</p></noscript>
<script>
  window.__errors = [];
  addEventListener('error', function (e) { __errors.push(String(e.message || e)); });
  addEventListener('unhandledrejection', function (e) { __errors.push('Promise: ' + String(e.reason && e.reason.message || e.reason)); });
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
