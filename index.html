<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7cc45a">
<title>Schmetterlingswiese</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#9ed1ff;
    font-family:-apple-system,"SF Pro Rounded","Segoe UI",Roboto,sans-serif;
    touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;}
  #c{position:fixed;inset:0;display:block;touch-action:none;}
  #hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);
    background:rgba(20,45,30,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    color:#fff;font-size:17px;font-weight:600;letter-spacing:.3px;
    padding:10px 18px;border-radius:999px;pointer-events:none;white-space:nowrap;
    box-shadow:0 4px 18px rgba(0,60,20,.25);}
  #hint{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 120px);left:50%;transform:translateX(-50%);
    background:rgba(255,255,255,.78);color:#234;font-weight:600;font-size:14px;
    padding:9px 16px;border-radius:999px;pointer-events:none;transition:opacity .6s;white-space:nowrap;text-align:center;}
  #toast{position:fixed;top:22%;left:50%;transform:translateX(-50%);
    background:rgba(255,255,255,.92);color:#1c5c2e;font-weight:700;font-size:18px;
    padding:12px 22px;border-radius:999px;pointer-events:none;opacity:0;transition:opacity .35s;white-space:nowrap;
    box-shadow:0 6px 24px rgba(0,40,10,.25);}
  #btnL,#btnR{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);
    width:76px;height:76px;border-radius:50%;border:2px solid rgba(255,255,255,.55);
    background:rgba(255,255,255,.30);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    color:#fff;font-size:26px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;
    box-shadow:0 4px 16px rgba(0,40,10,.22);padding:0;cursor:pointer;touch-action:none;}
  #btnL:active,#btnR:active{transform:scale(.92);}
  #btnL{left:calc(env(safe-area-inset-left,0px) + 18px);}
  #btnR{right:calc(env(safe-area-inset-right,0px) + 18px);}
  #btnL span,#btnR span{font-size:11px;margin-top:1px;letter-spacing:.4px;}
  #pick{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;
    background:rgba(15,40,25,.35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:30;}
  #pick .row{display:flex;gap:14px;}
  #pick button{width:96px;height:96px;border-radius:26px;border:2px solid rgba(255,255,255,.6);
    background:rgba(255,255,255,.85);font-size:44px;cursor:pointer;box-shadow:0 6px 20px rgba(0,40,10,.25);padding:0;}
  #pick button:active{transform:scale(.92);}
  #pick .cap{margin-top:12px;color:#fff;font-weight:700;font-size:14px;text-shadow:0 1px 6px rgba(0,30,10,.5);}
  #win{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;
    background:rgba(15,40,25,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
  #win .card{background:rgba(255,255,255,.93);border-radius:24px;padding:30px 38px;text-align:center;
    box-shadow:0 12px 50px rgba(0,40,10,.35);}
  #win h1{margin:0 0 6px;font-size:25px;color:#1c5c2e;}
  #win p{margin:0 0 20px;color:#345;font-size:16px;}
  #again{border:0;background:#2e9e4f;color:#fff;font-size:17px;font-weight:700;
    padding:13px 34px;border-radius:999px;cursor:pointer;}
  #again:active{transform:scale(.96);}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">🌸 0 / 10 &nbsp;·&nbsp; ⏱️ 0 s</div>
<div id="hint"> fingertippen &amp; halten:<br>links/rechts drehen · Mitte ▲ abheben ▼ sinken<br>Unten: 🤸 Loop &nbsp; 🌀 Schraube &nbsp;·&nbsp; Gedrückt halten = Tier wechseln</div>
<div id="toast"></div>
<div id="pick"><div class="row">
  <button id="pkB" aria-label="Schmetterling">🦋</button>
  <button id="pkL" aria-label="Marienkäfer">🐞</button>
  <button id="pkBee" aria-label="Biene">🐝</button>
</div><div class="cap">Wen möchtest du sein?</div></div>
<button id="btnL" aria-label="Looping">🤸<span>LOOP</span></button>
<button id="btnR" aria-label="Schraube">🌀<span>SCHRAUBE</span></button>
<div id="win"><div class="card"><h1>🌸 Alle Blüten gefunden!</h1><p id="winTime"></p><button id="again">Nochmal fliegen 🦋</button></div></div>
<script src="three.min.js"></script>
<script>
window.__errors=[];window.onerror=function(m,s,l){__errors.push(m+' @'+l);};
window.__frames=0;
(function(){
'use strict';
var V=THREE;
var canvas=document.getElementById('c');
var renderer;
try{ renderer=new V.WebGLRenderer({canvas:canvas,antialias:true}); }
catch(e){ __errors.push('WebGL nicht verfuegbar'); document.body.innerHTML='<p style="padding:40px">WebGL nicht verfügbar 😕</p>'; return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=V.PCFSoftShadowMap;

/* ---------- Weltkrümmung (Horizont-Bend) ---------- */
function C(mat){
  mat.onBeforeCompile=function(shader){
    shader.vertexShader=shader.vertexShader.replace(
      '#include <project_vertex>',
      ['vec4 mvPosition=vec4(transformed,1.0);',
       '#ifdef USE_INSTANCING',
       '  mvPosition=instanceMatrix*mvPosition;',
       '#endif',
       'vec4 wp=modelMatrix*mvPosition;',
       'wp.y-=0.00019*(wp.x*wp.x+wp.z*wp.z);',
       'mvPosition=viewMatrix*wp;',
       'gl_Position=projectionMatrix*mvPosition;'].join('\n')
    );
  };
  return mat;
}

var scene=new V.Scene();
scene.fog=new V.Fog(0xcfe9ff,70,300);
var camera=new V.PerspectiveCamera(62,innerWidth/innerHeight,0.1,1200);

/* ---------- Himmel + Sonne ---------- */
var sunDir=new V.Vector3(0.45,0.30,0.30).normalize();
var sky=new V.Mesh(new V.SphereGeometry(420,32,15),new V.ShaderMaterial({
  side:V.BackSide,depthWrite:false,
  uniforms:{top:{value:new V.Color(0x3f86d6)},mid:{value:new V.Color(0xa8d4f5)},bot:{value:new V.Color(0xeaf7dc)},sun:{value:sunDir}},
  vertexShader:'varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader:[
    'varying vec3 vP;uniform vec3 top,mid,bot,sun;',
    'void main(){vec3 d=normalize(vP);float h=d.y*0.5+0.5;',
    ' vec3 col=h<0.5?mix(bot,mid,smoothstep(0.35,0.5,h)):mix(mid,top,smoothstep(0.5,0.85,h));',
    ' float s=max(dot(d,sun),0.0);',
    ' col+=vec3(1.0,0.95,0.75)*pow(s,900.0)*1.3;',
    ' col+=vec3(1.0,0.9,0.6)*pow(s,80.0)*0.35;',
    ' gl_FragColor=vec4(col,1.0);}'].join('\n')
}));
scene.add(sky);

function radialTex(stops){
  var cv=document.createElement('canvas');cv.width=cv.height=128;
  var cx=cv.getContext('2d');
  var gr=cx.createRadialGradient(64,64,0,64,64,64);
  for(var i=0;i<stops.length;i++)gr.addColorStop(stops[i][0],stops[i][1]);
  cx.fillStyle=gr;cx.fillRect(0,0,128,128);
  var t=new V.CanvasTexture(cv);t.encoding=V.sRGBEncoding;
  return t;
}
var sunHaloTex=radialTex([[0,'rgba(255,244,200,0.95)'],[0.25,'rgba(255,236,150,0.55)'],[0.6,'rgba(255,220,120,0.18)'],[1,'rgba(255,210,110,0)']]);
var sunCoreTex=radialTex([[0,'rgba(255,255,255,1)'],[0.55,'rgba(255,250,220,1)'],[1,'rgba(255,245,200,0)']]);
var sunPos=sunDir.clone().multiplyScalar(380);
var sunHalo=new V.Sprite(new V.SpriteMaterial({map:sunHaloTex,transparent:true,depthWrite:false,blending:V.AdditiveBlending,fog:false}));
sunHalo.position.copy(sunPos);sunHalo.scale.setScalar(150);scene.add(sunHalo);
var sunCore=new V.Sprite(new V.SpriteMaterial({map:sunCoreTex,transparent:true,depthWrite:false,fog:false}));
sunCore.position.copy(sunPos);sunCore.scale.setScalar(42);scene.add(sunCore);

/* ---------- Licht ---------- */
scene.add(new V.HemisphereLight(0xcfe8ff,0x6fae52,0.85));
var sunL=new V.DirectionalLight(0xfff2d8,1.25);
sunL.castShadow=true;
sunL.shadow.mapSize.set(2048,2048);
var sc=sunL.shadow.camera;
sc.left=-40;sc.right=40;sc.top=40;sc.bottom=-40;sc.near=5;sc.far=220;
sunL.shadow.bias=-0.0006;
if('normalBias' in sunL.shadow)sunL.shadow.normalBias=0.02;
scene.add(sunL);scene.add(sunL.target);

/* ---------- Hügelige Wiese ---------- */
function gH(x,z){
  return 2.4*Math.sin(x*0.035+1.7)*Math.cos(z*0.041-0.6)
       +1.4*Math.sin(x*0.09-1.1)*Math.sin(z*0.075+2.0)
       +0.8*Math.cos(x*0.15)*Math.cos(z*0.17);
}
var gGeo=new V.PlaneGeometry(560,560,120,120);
gGeo.rotateX(-Math.PI/2);
var gp=gGeo.attributes.position,gcols=[];
var cA=new V.Color(0x4f9d3c),cB=new V.Color(0x7cc45a),cC=new V.Color(0xa9ce55),tc=new V.Color();
for(var i=0;i<gp.count;i++){
  var x=gp.getX(i),z=gp.getZ(i);
  gp.setY(i,gH(x,z));
  var p=V.MathUtils.clamp(0.5+0.5*Math.sin(x*0.05+Math.sin(z*0.07)*2.0),0,1);
  tc.copy(cA).lerp(cB,p);
  if(Math.sin(x*0.021+3.0)*Math.cos(z*0.019-1.0)>0.55)tc.lerp(cC,0.5);
  tc.offsetHSL(0,0,(Math.random()-0.5)*0.02);
  gcols.push(tc.r,tc.g,tc.b);
}
gGeo.setAttribute('color',new V.Float32BufferAttribute(gcols,3));
gGeo.computeVertexNormals();
var ground=new V.Mesh(gGeo,new V.MeshStandardMaterial({vertexColors:true,roughness:1,metalness:0}));
ground.receiveShadow=true;
scene.add(ground);

/* ---------- Blumen (Blütenblätter + Blätter) ---------- */
var FLOWER_N=700,DAISY_N=380,TUFT_N=320;
var dummy=new V.Object3D();
var stems=new V.InstancedMesh(new V.CylinderGeometry(0.025,0.04,0.55,5),
  new V.MeshStandardMaterial({color:0x3c8c38,roughness:1}),FLOWER_N);
var petals=new V.InstancedMesh(new V.SphereGeometry(0.09,6,4),
  new V.MeshStandardMaterial({roughness:0.55}),FLOWER_N*6);
var fcenters=new V.InstancedMesh(new V.SphereGeometry(0.07,6,5),
  new V.MeshStandardMaterial({roughness:0.4}),FLOWER_N);
var leaves=new V.InstancedMesh(new V.SphereGeometry(0.06,6,4),
  new V.MeshStandardMaterial({roughness:0.9}),FLOWER_N);
var palette=[0xff5a5f,0xffd23f,0x9b5de5,0xffffff,0xf15bb5,0x4cc9f0,0xff9e00].map(function(h){return new V.Color(h);});
var C_WHITE=new V.Color(0xffffff);
var fBase=[];
for(var i=0;i<FLOWER_N;i++){
  var r=6+95*Math.cbrt(Math.random()),a=Math.random()*6.2832;
  var fx=Math.cos(a)*r,fz=Math.sin(a)*r,fh=gH(fx,fz);
  var s=0.75+Math.random()*0.9;
  dummy.position.set(fx,fh+0.27*s,fz);dummy.rotation.set(0,0,0);dummy.scale.setScalar(s);dummy.updateMatrix();
  stems.setMatrixAt(i,dummy.matrix);
  var hy=fh+0.58*s,yaw=Math.random()*6.28;
  var daisy=Math.random()<0.18;
  var twoTone=!daisy&&Math.random()<0.5;
  var baseCol=daisy?C_WHITE:palette[(Math.random()*palette.length)|0];
  fBase.push({x:fx,z:fz,h:fh,s:s,ph:Math.random()*6.28,hy:hy,yaw:yaw,daisy:daisy});
  for(var k=0;k<6;k++){
    var pa=k*1.0472;
    dummy.rotation.order='YXZ';
    dummy.position.set(fx+Math.cos(pa)*0.082*s,hy-0.02*s,fz+Math.sin(pa)*0.082*s);
    dummy.rotation.set(0,-pa,0.58);
    dummy.scale.set(1.5*s,0.34*s,0.92*s);
    dummy.updateMatrix();
    petals.setMatrixAt(i*6+k,dummy.matrix);
    var pc=new V.Color().copy(baseCol);
    if(!daisy){
      if(twoTone&&k%2===0)pc.offsetHSL(0,0.04,0.11);
      pc.offsetHSL(0,0,(k%3)*0.018);
    }
    petals.setColorAt(i*6+k,pc);
  }
  dummy.rotation.order='XYZ';
  var cc=new V.Color().copy(daisy?new V.Color(0xffc933):new V.Color(0xffd54f));
  cc.offsetHSL(0,0,(Math.random()-0.5)*0.06);
  fcenters.setColorAt(i,cc);
  dummy.position.set(fx,hy,fz);dummy.rotation.set(0,0,0);dummy.scale.setScalar(s);dummy.updateMatrix();
  fcenters.setMatrixAt(i,dummy.matrix);
  var la=Math.random()*6.2832;
  dummy.position.set(fx+Math.cos(la)*0.07*s,fh+0.30*s,fz+Math.sin(la)*0.07*s);
  dummy.rotation.set(0.45*Math.sin(la),la,0.7);
  dummy.scale.set(1.5*s,0.35*s,0.85*s);
  dummy.updateMatrix();
  leaves.setMatrixAt(i,dummy.matrix);
  var lc=new V.Color().setHSL(0.28+Math.random()*0.05,0.6,0.32+Math.random()*0.1);
  leaves.setColorAt(i,lc);
}
scene.add(stems);scene.add(petals);scene.add(fcenters);scene.add(leaves);

var daisies=new V.InstancedMesh(new V.IcosahedronGeometry(0.07,0),
  new V.MeshStandardMaterial({color:0xffffff,roughness:0.8}),DAISY_N);
for(var i=0;i<DAISY_N;i++){
  var r=4+100*Math.cbrt(Math.random()),an=Math.random()*6.2832;
  var dx=Math.cos(an)*r,dz=Math.sin(an)*r;
  dummy.position.set(dx,gH(dx,dz)+0.35,dz);dummy.scale.setScalar(0.7+Math.random());dummy.updateMatrix();
  daisies.setMatrixAt(i,dummy.matrix);
}
scene.add(daisies);

var tufts=new V.InstancedMesh(new V.ConeGeometry(0.05,0.34,4),
  new V.MeshStandardMaterial({roughness:1}),TUFT_N);
var tcol=new V.Color();
for(var i=0;i<TUFT_N;i++){
  var r=3+105*Math.cbrt(Math.random()),an=Math.random()*6.2832;
  var tx=Math.cos(an)*r,tz=Math.sin(an)*r;
  dummy.position.set(tx,gH(tx,tz)+0.15,tz);
  dummy.scale.set(0.8+Math.random(),0.7+Math.random()*1.3,0.8+Math.random());
  dummy.rotation.set((Math.random()-0.5)*0.3,Math.random()*6.28,(Math.random()-0.5)*0.3);
  dummy.updateMatrix();
  tufts.setMatrixAt(i,dummy.matrix);
  tcol.setHSL(0.29+Math.random()*0.05,0.55,0.32+Math.random()*0.12);
  tufts.setColorAt(i,tcol);
}
scene.add(tufts);

/* ---------- Spazierende Tiere (Bärenbabys & Capybaras) ---------- */
var walkers=[];
function makeWalker(kind){
  var g=new V.Group();
  var fur,furDark,snout;
  if(kind==='capybara'){
    fur=new V.Color(0x9a6b3f);furDark=new V.Color(0x7a4f2a);snout=new V.Color(0xb98a5c);
  }else{
    fur=new V.Color(0x8a5a2b);furDark=new V.Color(0x5f3d1c);snout=new V.Color(0xd9b38c);
  }
  var fmat=new V.MeshStandardMaterial({color:fur,roughness:1,flatShading:true});
  var dmat=new V.MeshStandardMaterial({color:furDark,roughness:1,flatShading:true});
  var smat=new V.MeshStandardMaterial({color:snout,roughness:1});
  var body=new V.Mesh(new V.SphereGeometry(0.5,8,7),fmat);
  body.scale.set(1.25,0.85,0.8);body.position.y=0.42;body.castShadow=true;g.add(body);
  var head=new V.Mesh(new V.SphereGeometry(0.30,8,7),fmat);
  head.position.set(0,0.62,0.55);head.castShadow=true;g.add(head);
  var snoutM=new V.Mesh(new V.SphereGeometry(0.13,8,6),smat);
  snoutM.position.set(0,0.55,0.80);snoutM.scale.set(1,0.75,0.9);g.add(snoutM);
  var eyeG2=new V.SphereGeometry(0.038,6,5);
  var eyeM2=new V.MeshStandardMaterial({color:0x1a1008,roughness:0.35});
  for(var ey2=-1;ey2<=1;ey2+=2){
    var eye2=new V.Mesh(eyeG2,eyeM2);
    eye2.position.set(0.16*ey2,0.72,0.71);g.add(eye2);
  }
  var earGeo=new V.SphereGeometry(0.07,6,5);
  for(var e=-1;e<=1;e+=2){
    var ear=new V.Mesh(earGeo,dmat);
    ear.position.set(0.14*e,0.86,0.50);g.add(ear);
  }
  var legGeo=new V.CylinderGeometry(0.075,0.065,0.22,5);
  var legPos=[[-0.24,0.32],[0.24,0.32],[-0.22,-0.28],[0.22,-0.28]];
  var legs=[];
  for(var l=0;l<4;l++){
    var leg=new V.Mesh(legGeo,dmat);
    leg.position.set(legPos[l][0],0.11,legPos[l][1]);
    g.add(leg);legs.push(leg);
  }
  if(kind==='bear'){
    var tail=new V.Mesh(new V.SphereGeometry(0.09,6,5),dmat);
    tail.position.set(0,0.5,-0.45);g.add(tail);
  }
  var rr=8+88*Math.random(),an=Math.random()*6.2832;
  var wx=Math.cos(an)*rr,wz=Math.sin(an)*rr;
  g.position.set(wx,gH(wx,wz),wz);
  g.rotation.y=Math.random()*6.28;
  var sc=kind==='bear'?0.62:1.0;
  g.scale.setScalar(sc*(0.9+Math.random()*0.2));
  scene.add(g);
  walkers.push({g:g,kind:kind,legs:legs,head:head,
    a:Math.atan2(wz,wx),r:rr,dir:Math.random()<0.5?1:-1,
    speed:(0.5+Math.random()*0.4)*(kind==='bear'?0.8:1),
    ph:Math.random()*6.28,turnT:0,curious:0});
}
function makeAllWalkers(){
  var kinds=['bear','bear','bear','bear','capybara','capybara','capybara','capybara','capybara'];
  for(var i=0;i<9;i++)makeWalker(i<4?'bear':'capybara');
}
makeAllWalkers();

/* ---------- Luft-Freunde (Marienkäfer & bunte Schmetterlinge) ---------- */
function spotTexture(){
  var S=128,cv=document.createElement('canvas');cv.width=cv.height=S;
  var c2=cv.getContext('2d');
  c2.fillStyle='#d8262e';c2.fillRect(0,0,S,S);
  c2.fillStyle='#23150f';
  c2.beginPath();c2.moveTo(10,64);c2.lineTo(118,0);c2.lineTo(118,128);c2.closePath();c2.fill();
  c2.beginPath();c2.arc(10,64,12,0,6.3);c2.fill();
  c2.fillStyle='#fff';
  var dots=[[34,22],[52,52],[40,96],[72,30],[78,80],[98,54],[64,112],[92,108]];
  for(var i=0;i<dots.length;i++){c2.beginPath();c2.arc(dots[i][0],dots[i][1],7.5,0,6.3);c2.fill();}
  var t=new V.CanvasTexture(cv);t.encoding=V.sRGBEncoding;
  return t;
}
var ladyTex=spotTexture();
var ladyBodyMat=new V.MeshStandardMaterial({color:0x23150f,roughness:0.6});
var airPos=new V.Vector3();
function makeLadybug(){
  var useTex=Math.random()<0.5;
  var g=new V.Group();
  var b=new V.Mesh(new V.SphereGeometry(0.09,8,6),ladyBodyMat);
  b.scale.set(0.78,0.6,0.98);g.add(b);
  var eGeo=new V.SphereGeometry(0.09,8,6);
  var e1,e2;
  if(useTex){
    var hm=new V.MeshStandardMaterial({map:ladyTex,roughness:0.5});
    e1=new V.Mesh(eGeo,hm);e1.scale.set(0.80,0.66,1.08);e1.position.set(-0.036,0.055,-0.005);g.add(e1);
    e2=new V.Mesh(eGeo,hm);e2.scale.set(0.80,0.66,1.08);e2.position.set(0.036,0.055,-0.005);g.add(e2);
  }else{
    var redM=new V.MeshStandardMaterial({color:new V.Color().setHSL(0.01+Math.random()*0.02,0.85,0.42+Math.random()*0.14),roughness:0.45});
    e1=new V.Mesh(eGeo,redM);e1.scale.set(0.80,0.66,1.08);e1.position.set(-0.036,0.055,-0.005);g.add(e1);
    e2=new V.Mesh(eGeo,redM);e2.scale.set(0.80,0.66,1.08);e2.position.set(0.036,0.055,-0.005);g.add(e2);
    var dotM=new V.MeshStandardMaterial({color:0x1c120c,roughness:0.5});
    for(var dp2=0;dp2<5;dp2++){
      var d3=new V.Mesh(new V.SphereGeometry(0.02,5,4),dotM);
      var aa2=(dp2/5)*6.2832+Math.random()*0.5;
      d3.position.set(Math.cos(aa2)*0.055,0.102,Math.sin(aa2)*0.055-0.03);

function ding(f){
  try{
    if(!AC)return;
    var o=AC.createOscillator(),g=AC.createGain();
    o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.16,AC.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+0.38);
    o.connect(g);g.connect(AC.destination);
    o.start();o.stop(AC.currentTime+0.42);
  }catch(e){}
}
function landSound(){
  try{
    if(!AC)return;
    ding(660);setTimeout(function(){ding(440);},120);
  }catch(e){}
}
function woosh(kind){
  try{
    if(!AC)return;
    var o=AC.createOscillator(),g=AC.createGain();
    o.type='sine';
    var t0=AC.currentTime;
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(0.14,t0+0.08);
    if(kind==='loop'){
      o.frequency.setValueAtTime(260,t0);
      o.frequency.linearRampToValueAtTime(760,t0+0.8);
      o.frequency.linearRampToValueAtTime(300,t0+1.6);
    }else{
      o.frequency.setValueAtTime(620,t0);
      o.frequency.linearRampToValueAtTime(300,t0+0.6);
      o.frequency.linearRampToValueAtTime(680,t0+1.2);
      o.frequency.linearRampToValueAtTime(360,t0+1.7);
    }
    g.gain.exponentialRampToValueAtTime(0.0001,t0+1.8);
    o.connect(g);g.connect(AC.destination);
    o.start(t0);o.stop(t0+1.9);
  }catch(e){}
}

/* ---------- HUD / Animation ---------- */
var clock=new V.Clock();
var flapT=0,lookAt=new V.Vector3(),camGoal=new V.Vector3(),flat=new V.Vector3();
camera.position.set(st.pos.x,st.pos.y+3,st.pos.z+8);
var toastBase=gH(0,12);
function angDiff(a){return Math.atan2(Math.sin(a),Math.cos(a));}

function animate(){
  requestAnimationFrame(animate);
  window.__frames++;
  var dt=Math.min(clock.getDelta(),0.05);
  var time=clock.elapsedTime;
  if(started&&!finished)elapsed+=dt;
  var frozen=window.__freeze!==undefined;

  if(!frozen){
    /* --- Eingabe: Zonen --- */
    var zx=0,zy=0,nL=0,nR=0,nU=0,nD=0;
    for(var pid in zones){
      var z=zones[pid];
      if(z==='L')nL++;else if(z==='R')nR++;
      else if(z==='U')nU++;else if(z==='D')nD++;
    }
    zx=(nL>0?-1:0)+(nR>0?1:0);
    zy=(nU>0?1:0)+(nD>0?-1:0);
    if(keys.ArrowLeft||keys.KeyA)zx-=1;
    if(keys.ArrowRight||keys.KeyD)zx+=1;
    if(keys.ArrowUp||keys.KeyW)zy+=1;
    if(keys.ArrowDown||keys.KeyS)zy-=1;
    var inX=V.MathUtils.clamp(zx,-1,1);
    var inY=V.MathUtils.clamp(zy,-1,1);
    zoneIn.x+=(inX-zoneIn.x)*Math.min(1,dt*8);
    zoneIn.y+=(inY-zoneIn.y)*Math.min(1,dt*8);
    inX=zoneIn.x;inY=zoneIn.y;

    var moving=(Math.abs(inX)>0.03||(Math.abs(inY)>0.03&&!landed));
    _moving=moving;

    /* --- Stunt --- */
    if(stunt.active){
      stunt.t+=dt;
      var prog=V.MathUtils.clamp(stunt.t/stunt.dur,0,1);
      var ease=0.5-0.5*Math.cos(Math.PI*prog);
      if(stunt.type==='loop'){_loopAng=-Math.PI*2*ease;_fovT=52;}
      else{_rollAng=Math.PI*2*ease;_fovT=56;
        /* Schraube: leichte Steige, geradeaus (kein Yaw-Drift) */
        st.pos.y+=2.2*dt*Math.sin(Math.PI*prog);}
      if(prog>=1){
        stunt.active=false;
        sparkle(B.position.clone(),12);
      }
    }else{_loopAng=0;_rollAng=0;_fovT=62;}

    if(landed){
      /* --- Gelandet --- */
      st.pos.y=py_(landSpot)+Math.sin(time*2.2)*0.03;
      st.pitch+=(0-st.pitch)*Math.min(1,dt*5);
      var tYawRateL=-inX*1.3;
      st.yawRate+=(tYawRateL-st.yawRate)*Math.min(1,dt*5);
      st.yaw+=st.yawRate*dt;
      if(inY>0.25){takeoff();}
      flapT+=dt*3.5;
    }else{
      /* --- Fliegen --- */
      var tYawRate=-inX*(stunt.active?0.6:2.1);
      st.yawRate+=(tYawRate-st.yawRate)*Math.min(1,dt*6);
      st.yaw+=st.yawRate*dt;
      if(!stunt.active){
        var tPitch=V.MathUtils.clamp(inY*0.55,-0.55,0.62);
        st.pitch+=(tPitch-st.pitch)*Math.min(1,dt*4);
      }
      var spd=9.0*(1-st.pitch*0.45)+(stunt.active?2.0:0);
      var cp=Math.cos(st.pitch);
      var fw=new V.Vector3(Math.sin(st.yaw)*cp,Math.sin(st.pitch),Math.cos(st.yaw)*cp);
      st.pos.addScaledVector(fw,spd*dt);

      /* Grenzen */
      var rh=Math.hypot(st.pos.x,st.pos.z);
      if(rh>235){
        var des=Math.atan2(-st.pos.x,-st.pos.z);
        st.yaw+=angDiff(des-st.yaw)*Math.min(1,(rh-235)/50)*dt*2.2;
        if(rh>265){st.pos.x*=262/rh;st.pos.z*=262/rh;}
      }
      var sinkingNow=(inY<-0.25&&!stunt.active);
      if(!sinkingNow){
        var gy=gH(st.pos.x,st.pos.z)+1.1;
        if(st.pos.y<gy){st.pos.y=gy;if(st.pitch<0.2)st.pitch+=(0.2-st.pitch)*Math.min(1,dt*4);}
      }
      if(st.pos.y>46){st.pos.y=Math.min(st.pos.y,47);if(st.pitch>-0.05)st.pitch+=(-0.05-st.pitch)*Math.min(1,dt*4);}

      /* --- Landung: sinken + Nähe Blüte/Boden --- */
      if(inY<-0.25&&!stunt.active){
        /* Blüten-Landepad suchen */
        var bestC=null,bestD=99;
        for(var li=0;li<collectibles.length;li++){
          var c=collectibles[li];
          var ddx=st.pos.x-c.center.x,dzz=st.pos.z-c.center.z;
          var hd=Math.sqrt(ddx*ddx+dzz*dzz);
          if(hd<2.6&&hd<bestD){bestD=hd;bestC=c;}
        }
        if(bestC){
          var targetY=bestC.padY;
          /* sanft absenken */
          st.pos.y+=(targetY-st.pos.y)*Math.min(1,dt*4);
          if(Math.abs(st.pos.y-targetY)<0.45)doLand(bestC,targetY);
        }else{
          var gy3=gH(st.pos.x,st.pos.z)+0.5;
          if(st.pos.y>gy3)st.pos.y+=(gy3-st.pos.y)*Math.min(1,dt*3);
          if(st.pos.y-gH(st.pos.x,st.pos.z)<0.75)doLand(null,gy3);
        }
      }
      flapT+=dt*((moving?17:8)+(stunt.active?6:0));
    }
  }

  /* --- Körper-Pose (auch bei freeze nutzbar) --- */
  if(!frozen){
    var bobLanded=landed?Math.sin(time*2.2)*0.02:Math.sin(time*3.1)*0.15;
    B.position.set(st.pos.x,st.pos.y+bobLanded,st.pos.z);
    B.rotation.y=st.yaw;
    B.rotation.x=-st.pitch*0.75+loopAngGlobal();
    B.rotation.z=V.MathUtils.clamp(-st.yawRate*0.32,-0.62,0.62)+rollAngGlobal();
  }

  /* --- Flügel (je nach Charakter) --- */
  if(!frozen){
    var amp=(movingGlobal()&&!landed?1.0:0.6)+0.1*Math.sin(time*0.9);
    if(landed)amp=0.22;
    var angL=Math.sin(flapT)*amp+0.38;
    if(landed)angL=1.05+Math.sin(time*1.1)*0.06;
    if(curChar===charBee)angL=0.62+Math.sin(flapT)*0.32*amp;
    if(curChar===charLady)angL=0.58+Math.sin(flapT)*0.36*amp;
    curChar.pR.rotation.z=angL;
    curChar.pL.rotation.z=-angL;
    /* Nebenfalter-Flügel leicht gegenphasig */
    if(curChar!==charBfly){
      if(charBfly.grp.visible){
        charBfly.pR.rotation.z=Math.sin(flapT)*amp*0.6+0.55;
        charBfly.pL.rotation.z=-charBfly.pR.rotation.z;}
      if(charLady.grp.visible){
        charLady.pR.rotation.z=Math.sin(flapT*charLady.flapMul)*0.4*amp+0.2;
        charLady.pL.rotation.z=-charLady.pR.rotation.z;}
      if(charBee.grp.visible){
        charBee.pR.rotation.z=Math.sin(flapT*charBee.flapMul)*0.8;
        charBee.pL.rotation.z=-charBee.pR.rotation.z;}
    }
  }

  /* --- Spieler-Schatten (Höhenmarker) --- */
  if(!frozen){
    var gySh=gH(st.pos.x,st.pos.z);
    shadowMesh.position.set(st.pos.x,gySh+0.06,st.pos.z);
    var hSh=V.MathUtils.clamp(st.pos.y-gySh,0.5,44);
    var sSc=V.MathUtils.clamp(1.35-hSh*0.016,0.25,1.2);
    shadowMesh.scale.set(sSc,sSc,1);
    shadowMesh.material.opacity=V.MathUtils.clamp(0.42-hSh*0.0072,0.06,0.42);
  }

  /* --- Kamera --- */
  flat.set(Math.sin(st.yaw),0,Math.cos(st.yaw));
  if(!frozen){
    camGoal.copy(B.position).addScaledVector(flat,-7.2);
    camGoal.y=B.position.y+2.6-st.pitch*2.0;
    var gy2=gH(camGoal.x,camGoal.z)+1.2;
    if(camGoal.y<gy2)camGoal.y=gy2;
    camera.position.lerp(camGoal,1-Math.pow(0.0012,dt));
    lookAt.copy(B.position).addScaledVector(flat,4.0);lookAt.y+=0.6;
    camera.lookAt(lookAt);
    var fovNow=camera.fov;
    if(Math.abs(fovNow-fovTargetGlobal())>0.1){camera.fov+=(fovTargetGlobal()-fovNow)*Math.min(1,dt*4);camera.updateProjectionMatrix();}
  }

  /* --- Sonne folgen --- */
  sunL.position.copy(B.position).addScaledVector(sunDir,90);
  sunL.target.position.copy(B.position);

  /* --- Wolken --- */
  for(var ci=0;ci<clouds.length;ci++){
    clouds[ci].g.position.x+=dt*clouds[ci].vx;
    if(clouds[ci].g.position.x>240)clouds[ci].g.position.x=-240;
  }

  /* --- Blumen wiegen (Blüten + Herzen) --- */
  if(!frozen){
    for(var fi=0;fi<FLOWER_N;fi++){
      var fb=fBase[fi];
      var sw=Math.sin(time*1.6+fb.ph)*0.06;
      var cx=fb.x+sw,cz=fb.z+sw*0.4;
      dummy.rotation.order='YXZ';
      dummy.scale.set(1.35*fb.s,0.38*fb.s,0.8*fb.s);
      for(var k2=0;k2<6;k2++){
        var pa2=k2*1.0472;
        dummy.position.set(cx+Math.cos(pa2)*0.105*fb.s,fb.hy-0.02*fb.s+Math.abs(sw)*0.12*fb.s,cz+Math.sin(pa2)*0.105*fb.s);
        dummy.rotation.set(0,-pa2+sw,0.62+sw*0.5);
        dummy.updateMatrix();
        petals.setMatrixAt(fi*6+k2,dummy.matrix);
      }
      dummy.rotation.order='XYZ';
      dummy.position.set(cx,fb.hy+Math.abs(sw)*0.12*fb.s,cz);
      dummy.rotation.set(sw,0,sw*0.7);
      dummy.scale.setScalar(fb.s);
      dummy.updateMatrix();
      fcenters.setMatrixAt(fi,dummy.matrix);
    }
    petals.instanceMatrix.needsUpdate=true;
    fcenters.instanceMatrix.needsUpdate=true;
  }

  /* --- Tiere am Boden: wandern + Beine + Neugier --- */
  if(!frozen){
    for(var wi=0;wi<walkers.length;wi++){
      var wk=walkers[wi];
      wk.a+=wk.speed*wk.dir*dt/wk.r;
      var wx2=Math.cos(wk.a)*wk.r,wz2=Math.sin(wk.a)*wk.r;
      wk.g.position.set(wx2,gH(wx2,wz2)+Math.abs(Math.sin(time*wk.speed*7+wk.ph))*0.02,wz2);
      wk.g.rotation.y=(wk.dir>0? -wk.a : wk.a+Math.PI);
      var cyc=time*wk.speed*7+wk.ph;
      for(var lg=0;lg<4;lg++){
        wk.legs[lg].rotation.x=Math.sin(cyc+(lg%2?0.7:0)+(lg>1?3.14:0))*0.55;
      }
      var db=B.position.distanceTo(wk.g.position);
      var cur=db<8?(8-db)/8:0;
      if(cur>0.04){
        wk.head.rotation.x=-0.55*cur*(0.85+0.15*Math.sin(time*3+wk.ph));
      }else{
        wk.head.rotation.x*=Math.max(0,1-dt*3);
      }
    }
    /* --- Luft-Freunde --- */
    for(var ff=0;ff<flyers.length;ff++){
      var fl=flyers[ff];
      fl.w1+=fl.sp1*dt;fl.w2+=fl.sp2*dt;
      var fx2=fl.x+Math.cos(fl.w1)*fl.r1;
      var fz2=fl.z+Math.sin(fl.w1)*fl.r1*0.8;
      var fy2=fl.baseH+Math.sin(fl.w2)*0.35+Math.sin(time*2.3+fl.ph)*0.12;
      var gh2=gH(fx2,fz2)+0.9;
      if(fy2<gh2)fy2=gh2;
      airPos.set(fx2,fy2,fz2);
      fl.g.position.copy(airPos);
      var vx2=-Math.sin(fl.w1)*fl.sp1*fl.r1,vz2=Math.cos(fl.w1)*fl.sp1*fl.r1*0.8;
      var hd=Math.atan2(vx2,vz2);
      fl.g.rotation.y+=angDiff(hd-fl.g.rotation.y)*Math.min(1,dt*5);
      /* leicht nach vorn geneigt + in Kurve gelehnt = fliegt statt steht */
      fl.g.rotation.x=0.16;
      fl.g.rotation.z=V.MathUtils.clamp(-fl.sp1*0.35,-0.4,0.4)*0.6;
      var fw2=Math.sin(time*(26+fl.sp2*10)+fl.ph);
      if(fl.pivR){fl.pivR.rotation.z=0.3+fw2*1.0;fl.pivL.rotation.z=-0.3-fw2*1.0;}
      else{fl.wing1.rotation.x=-0.1+fw2*0.5;fl.wing2.rotation.x=-0.1-fw2*0.5;}
    }
  }

  /* --- Sammel-Blüten --- */
  if(!frozen){
    for(var gi=0;gi<collectibles.length;gi++){
      var c=collectibles[gi];
      if(c.taken)continue;
      c.head.position.y=1.0+Math.sin(time*2+gi)*0.05;
      c.spr.material.opacity=0.5+0.3*Math.sin(time*3+c.ph);
      c.spr.scale.setScalar(1.8+0.25*Math.sin(time*3+c.ph));
      if(c.center.distanceToSquared(B.position)<2.3*2.3)take(c);
    }
  }

  /* --- Funken --- */
  for(var si=sparks.length-1;si>=0;si--){
    var sp=sparks[si];
    sp.life-=dt;
    sp.s.position.addScaledVector(sp.v,dt);
    sp.v.y+=1.2*dt;
    sp.s.material.opacity=Math.max(sp.life,0);
    if(sp.life<=0){scene.remove(sp.s);sp.s.material.dispose();sparks.splice(si,1);}
  }

  renderer.render(scene,camera);
}

function loopAngGlobal(){return _loopAng;}
function rollAngGlobal(){return _rollAng;}
function fovTargetGlobal(){return _fovT;}
function movingGlobal(){return _moving;}
updHUD();

/* Weltkrümmung auf alle Mesh-Materialien (vor dem ersten Compile gesetzt) */
(function(){
  var seen={};
  scene.traverse(function(o){
    if(!o.material)return;
    var mats=Array.isArray(o.material)?o.material:[o.material];
    for(var i=0;i<mats.length;i++){
      var m=mats[i];
      if(seen[m.uuid])continue;
      seen[m.uuid]=1;
      if(m.isMeshStandardMaterial||m.isMeshBasicMaterial||m.isMeshLambertMaterial||m.isMeshPhongMaterial){
        C(m);
        /* Depth-Pass ebenfalls beugen (Sonst: Schatten an der unverbogenen Welt) */
        if(m.isMeshBasicMaterial||m.isMeshLambertMaterial||m.isMeshPhongMaterial||m.isMeshStandardMaterial){
          if(!m.customDepthMaterial){
            m.customDepthMaterial=new V.MeshDepthMaterial({depthPacking:V.RGBADepthPacking});
            m.customDepthMaterial.onBeforeCompile=function(shader){
              shader.vertexShader=shader.vertexShader.replace(
                '#include <project_vertex>',
                'vec4 wpos=vec4(transformed,1.0);\n'+
                '#ifdef USE_INSTANCING\nwpos=instanceMatrix*wpos;\n#endif\n'+
                'wpos=modelMatrix*wpos;wpos.y-=0.00019*(wpos.x*wpos.x+wpos.z*wpos.z);vec4 mvPosition=viewMatrix*wpos;gl_Position=projectionMatrix*mvPosition;'
              );
            };
          }
        }
      }
    }
  });
})();

/* Test-/Debug-API */
window.__game={
  st:st,
  B:B,pivR:pivotR,pivL:pivotL,wingMat:wingMatM,scene:scene,camera:camera,
  switchChar:switchChar,curCharName:function(){return CHAR_NAMES[Object.keys(CHAR_NAMES)[0]]||'';},
  walkers:walkers,flyers:flyers,
  sunYaw:function(){return Math.atan2(sunDir.x,sunDir.z);},
  score:function(){return score;},
  state:function(){return {landed:landed,stunt:stunt.type,stuntActive:stunt.active,stuntCount:stunt.stuntCount};},
  collectibles:collectibles.map(function(c){return c.center;}),
  zones:zones,
  tryStunt:tryStunt
};
})();
