<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7cc45a">
<title>Schmetterlingswiese</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#9ed1ff;
    font-family:-apple-system,"SF Pro Rounded","Segoe UI",Roboto,sans-serif;
    touch-action:none;-webkit-user-select:none;user-select:none;}
  #c{position:fixed;inset:0;display:block;}
  #hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);
    background:rgba(20,45,30,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    color:#fff;font-size:17px;font-weight:600;letter-spacing:.3px;
    padding:10px 18px;border-radius:999px;pointer-events:none;white-space:nowrap;
    box-shadow:0 4px 18px rgba(0,60,20,.25);}
  #hint{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);left:50%;transform:translateX(-50%);
    background:rgba(255,255,255,.78);color:#234;font-weight:600;font-size:15px;
    padding:9px 16px;border-radius:999px;pointer-events:none;transition:opacity .6s;white-space:nowrap;}
  #win{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;
    background:rgba(15,40,25,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
  #win .card{background:rgba(255,255,255,.93);border-radius:24px;padding:30px 38px;text-align:center;
    box-shadow:0 12px 50px rgba(0,40,10,.35);}
  #win h1{margin:0 0 6px;font-size:25px;color:#1c5c2e;}
  #win p{margin:0 0 20px;color:#345;font-size:16px;}
  #again{border:0;background:#2e9e4f;color:#fff;font-size:17px;font-weight:700;
    padding:13px 34px;border-radius:999px;cursor:pointer;}
  #again:active{transform:scale(.96);}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">🌸 0 / 10 &nbsp;·&nbsp; ⏱️ 0 s</div>
<div id="hint">👋 Ziehen = steuern &nbsp;·&nbsp; sammle die ✨‑Blüten</div>
<div id="win"><div class="card"><h1>🌸 Alle Blüten gefunden!</h1><p id="winTime"></p><button id="again">Nochmal fliegen 🦋</button></div></div>
<script src="three.min.js"></script>
<script>
window.__errors=[];window.onerror=function(m,s,l){__errors.push(m+' @'+l);};
window.__frames=0;
(function(){
'use strict';
var V=THREE;
var canvas=document.getElementById('c');
var renderer;
try{ renderer=new V.WebGLRenderer({canvas:canvas,antialias:true}); }
catch(e){ __errors.push('WebGL nicht verfuegbar'); document.body.innerHTML='<p style="padding:40px">WebGL nicht verfügbar 😕</p>'; return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=V.PCFSoftShadowMap;

var scene=new V.Scene();
scene.fog=new V.Fog(0xcfe9ff,70,300);
var camera=new V.PerspectiveCamera(62,innerWidth/innerHeight,0.1,1200);

/* ---------- Himmel mit Sonne ---------- */
var sunDir=new V.Vector3(0.45,0.55,0.3).normalize();
var sky=new V.Mesh(new V.SphereGeometry(420,32,15),new V.ShaderMaterial({
  side:V.BackSide,depthWrite:false,
  uniforms:{top:{value:new V.Color(0x3f86d6)},mid:{value:new V.Color(0xa8d4f5)},bot:{value:new V.Color(0xeaf7dc)},sun:{value:sunDir}},
  vertexShader:'varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader:[
    'varying vec3 vP;uniform vec3 top,mid,bot,sun;',
    'void main(){vec3 d=normalize(vP);float h=d.y*0.5+0.5;',
    ' vec3 col=h<0.5?mix(bot,mid,smoothstep(0.35,0.5,h)):mix(mid,top,smoothstep(0.5,0.85,h));',
    ' float s=max(dot(d,sun),0.0);',
    ' col+=vec3(1.0,0.95,0.75)*pow(s,900.0)*1.3;',
    ' col+=vec3(1.0,0.9,0.6)*pow(s,80.0)*0.35;',
    ' gl_FragColor=vec4(col,1.0);}'].join('\n')
}));
scene.add(sky);

/* ---------- Licht ---------- */
scene.add(new V.HemisphereLight(0xcfe8ff,0x6fae52,0.85));
var sunL=new V.DirectionalLight(0xfff2d8,1.25);
sunL.castShadow=true;
sunL.shadow.mapSize.set(2048,2048);
var sc=sunL.shadow.camera;
sc.left=-40;sc.right=40;sc.top=40;sc.bottom=-40;sc.near=5;sc.far=220;
sunL.shadow.bias=-0.0006;
if('normalBias' in sunL.shadow)sunL.shadow.normalBias=0.02;
scene.add(sunL);scene.add(sunL.target);

/* ---------- Hügelige Wiese ---------- */
function gH(x,z){
  return 2.4*Math.sin(x*0.035+1.7)*Math.cos(z*0.041-0.6)
       +1.4*Math.sin(x*0.09-1.1)*Math.sin(z*0.075+2.0)
       +0.8*Math.cos(x*0.15)*Math.cos(z*0.17);
}
var gGeo=new V.PlaneGeometry(560,560,120,120);
gGeo.rotateX(-Math.PI/2);
var gp=gGeo.attributes.position,gcols=[];
var cA=new V.Color(0x4f9d3c),cB=new V.Color(0x7cc45a),cC=new V.Color(0xa9ce55),tc=new V.Color();
for(var i=0;i<gp.count;i++){
  var x=gp.getX(i),z=gp.getZ(i);
  gp.setY(i,gH(x,z));
  var p=V.MathUtils.clamp(0.5+0.5*Math.sin(x*0.05+Math.sin(z*0.07)*2.0),0,1);
  tc.copy(cA).lerp(cB,p);
  if(Math.sin(x*0.021+3.0)*Math.cos(z*0.019-1.0)>0.55)tc.lerp(cC,0.5);
  tc.offsetHSL(0,0,(Math.random()-0.5)*0.02);
  gcols.push(tc.r,tc.g,tc.b);
}
gGeo.setAttribute('color',new V.Float32BufferAttribute(gcols,3));
gGeo.computeVertexNormals();
var ground=new V.Mesh(gGeo,new V.MeshStandardMaterial({vertexColors:true,roughness:1,metalness:0}));
ground.receiveShadow=true;
scene.add(ground);

/* ---------- Blumen (instanziert) ---------- */
var FLOWER_N=700,DAISY_N=380,TUFT_N=320;
var dummy=new V.Object3D();
var stems=new V.InstancedMesh(new V.CylinderGeometry(0.025,0.04,0.55,5),
  new V.MeshStandardMaterial({color:0x3c8c38,roughness:1}),FLOWER_N);
var heads=new V.InstancedMesh(new V.IcosahedronGeometry(0.14,0),
  new V.MeshStandardMaterial({roughness:0.6}),FLOWER_N);
var palette=[0xff5a5f,0xffd23f,0x9b5de5,0xffffff,0xf15bb5,0x4cc9f0,0xff9e00].map(function(h){return new V.Color(h);});
var fBase=[];
for(var i=0;i<FLOWER_N;i++){
  var r=6+95*Math.cbrt(Math.random()),a=Math.random()*6.2832;
  var fx=Math.cos(a)*r,fz=Math.sin(a)*r,fh=gH(fx,fz);
  var s=0.75+Math.random()*0.9;
  dummy.position.set(fx,fh+0.27*s,fz);dummy.rotation.set(0,0,0);dummy.scale.setScalar(s);dummy.updateMatrix();
  stems.setMatrixAt(i,dummy.matrix);
  dummy.position.y=fh+0.56*s;dummy.rotation.set(0,Math.random()*6.28,0);dummy.updateMatrix();
  heads.setMatrixAt(i,dummy.matrix);
  heads.setColorAt(i,palette[(Math.random()*palette.length)|0]);
  fBase.push({x:fx,z:fz,h:fh,s:s,ph:Math.random()*6.28});
}
scene.add(stems);scene.add(heads);

var daisies=new V.InstancedMesh(new V.IcosahedronGeometry(0.07,0),
  new V.MeshStandardMaterial({color:0xffffff,roughness:0.8}),DAISY_N);
for(var i=0;i<DAISY_N;i++){
  var r=4+100*Math.cbrt(Math.random()),an=Math.random()*6.2832;
  var dx=Math.cos(an)*r,dz=Math.sin(an)*r;
  dummy.position.set(dx,gH(dx,dz)+0.35,dz);dummy.scale.setScalar(0.7+Math.random());dummy.updateMatrix();
  daisies.setMatrixAt(i,dummy.matrix);
}
scene.add(daisies);

var tufts=new V.InstancedMesh(new V.ConeGeometry(0.05,0.34,4),
  new V.MeshStandardMaterial({roughness:1}),TUFT_N);
var tcol=new V.Color();
for(var i=0;i<TUFT_N;i++){
  var r=3+105*Math.cbrt(Math.random()),an=Math.random()*6.2832;
  var tx=Math.cos(an)*r,tz=Math.sin(an)*r;
  dummy.position.set(tx,gH(tx,tz)+0.15,tz);
  dummy.scale.set(0.8+Math.random(),0.7+Math.random()*1.3,0.8+Math.random());
  dummy.rotation.set((Math.random()-0.5)*0.3,Math.random()*6.28,(Math.random()-0.5)*0.3);
  dummy.updateMatrix();
  tufts.setMatrixAt(i,dummy.matrix);
  tcol.setHSL(0.29+Math.random()*0.05,0.55,0.32+Math.random()*0.12);
  tufts.setColorAt(i,tcol);
}
scene.add(tufts);

/* ---------- Büsche & Bäume (Tiefenanker) ---------- */
var bushMat=new V.MeshStandardMaterial({color:0x2f7d33,roughness:1,flatShading:true});
var bushGeo=new V.IcosahedronGeometry(1,1);
for(var i=0;i<14;i++){
  var r=70+72*Math.random(),an=Math.random()*6.2832;
  var bx=Math.cos(an)*r,bz=Math.sin(an)*r;
  var b=new V.Mesh(bushGeo,bushMat);
  b.position.set(bx,gH(bx,bz)+0.5,bz);
  b.scale.set(1.6+Math.random()*2.3,1.1+Math.random()*1.3,1.6+Math.random()*2.3);
  b.rotation.y=Math.random()*6.28;b.castShadow=true;
  scene.add(b);
}
var trunkMat=new V.MeshStandardMaterial({color:0x7a5230,roughness:1});
var crownMat=new V.MeshStandardMaterial({color:0x3f9644,roughness:1,flatShading:true});
for(var i=0;i<7;i++){
  var r=48+100*Math.random(),an=Math.random()*6.2832;
  var tx=Math.cos(an)*r,tz=Math.sin(an)*r,th=gH(tx,tz);
  var g=new V.Group();
  var trunk=new V.Mesh(new V.CylinderGeometry(0.22,0.36,3.6,7),trunkMat);
  trunk.position.y=1.8;trunk.castShadow=true;
  var crown=new V.Mesh(new V.IcosahedronGeometry(2.1,1),crownMat);
  crown.position.y=4.5;crown.scale.set(1.2,0.9+Math.random()*0.5,1.2);crown.castShadow=true;
  g.add(trunk);g.add(crown);
  g.position.set(tx,th,tz);g.rotation.y=Math.random()*6.28;
  scene.add(g);
}

/* ---------- Wolken ---------- */
var cloudGeo=new V.SphereGeometry(1,10,7);
var cloudMat=new V.MeshStandardMaterial({color:0xffffff,roughness:1,emissive:0xdfeaff,emissiveIntensity:0.35});
var clouds=[];
for(var i=0;i<9;i++){
  var g=new V.Group();
  var n=3+(Math.random()*3|0);
  for(var j=0;j<n;j++){
    var cs=new V.Mesh(cloudGeo,cloudMat);
    cs.position.set((j-(n-1)/2)*2.7+Math.random()*1.5,Math.random()*0.8,(Math.random()-0.5)*1.8);
    cs.scale.set(2+Math.random()*2.4,1+Math.random()*0.9,1.6+Math.random());
    g.add(cs);
  }
  g.position.set((Math.random()-0.5)*380,55+Math.random()*35,(Math.random()-0.5)*380);
  scene.add(g);clouds.push(g);
}

/* ---------- Sammel-Blüten ---------- */
var TARGETS=10;
function glowTexture(){
  var cv=document.createElement('canvas');cv.width=cv.height=64;
  var cx=cv.getContext('2d');
  var gr=cx.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'rgba(255,255,255,1)');
  gr.addColorStop(0.35,'rgba(255,240,170,0.75)');
  gr.addColorStop(1,'rgba(255,220,120,0)');
  cx.fillStyle=gr;cx.fillRect(0,0,64,64);
  return new V.CanvasTexture(cv);
}
var glowTex=glowTexture();
var collectibles=[];
var flowerPalette=[0xff6f91,0xb388ff,0xffa726,0xff5252,0x448aff,0xffd54f];
var petGeo=new V.SphereGeometry(1,8,6); // wird skaliert
var stemGeo2=new V.CylinderGeometry(0.05,0.08,0.9,6);
var stemMat2=new V.MeshStandardMaterial({color:0x3c8c38,roughness:1});
var centerMat=new V.MeshStandardMaterial({color:0xffe082,roughness:0.5,emissive:0x554400});
for(var i=0;i<TARGETS;i++){
  var rr=13+58*Math.cbrt(Math.random());
  var aa=(i/TARGETS)*6.2832+Math.random()*0.5;
  var cx2=Math.cos(aa)*rr,cz2=Math.sin(aa)*rr,ch=gH(cx2,cz2);
  var g=new V.Group();g.position.set(cx2,ch,cz2);
  var st=new V.Mesh(stemGeo2,stemMat2);st.position.y=0.45;g.add(st);
  var head=new V.Group();head.position.y=1.0;g.add(head);
  var pm=new V.MeshStandardMaterial({color:flowerPalette[i%flowerPalette.length],roughness:0.55});
  for(var k=0;k<6;k++){
    var pe=new V.Mesh(petGeo,pm);
    var pa=k/6*6.2832;
    pe.position.set(Math.cos(pa)*0.24,0,Math.sin(pa)*0.24);
    pe.scale.set(0.30,0.055,0.17);
    pe.rotation.y=pa;
    head.add(pe);
  }
  var ce=new V.Mesh(new V.SphereGeometry(0.13,8,6),centerMat);head.add(ce);
  var spr=new V.Sprite(new V.SpriteMaterial({map:glowTex,transparent:true,depthWrite:false,blending:V.AdditiveBlending,opacity:0.8}));
  spr.position.y=1.5;spr.scale.setScalar(2.0);g.add(spr);
  scene.add(g);
  collectibles.push({group:g,head:head,spr:spr,taken:false,ph:Math.random()*6.28,center:new V.Vector3(cx2,ch+1.0,cz2)});
}

/* ---------- Funken ---------- */
var sparks=[];
var sparkCols=[0xffe082,0xfff3c4,0xffab91,0xb388ff];
function sparkle(pt){
  if(sparks.length>60)return;
  for(var i=0;i<14;i++){
    var s=new V.Sprite(new V.SpriteMaterial({map:glowTex,transparent:true,depthWrite:false,blending:V.AdditiveBlending,
      color:sparkCols[i%sparkCols.length]}));
    s.position.copy(pt);
    s.scale.setScalar(0.35+Math.random()*0.4);
    scene.add(s);
    sparks.push({s:s,v:new V.Vector3((Math.random()-0.5)*3.2,1.6+Math.random()*2.6,(Math.random()-0.5)*3.2),life:0.9});
  }
}

/* ---------- Schmetterling ---------- */
function wingTexture(){
  var S=256,cv=document.createElement('canvas');cv.width=cv.height=S;
  var c2=cv.getContext('2d');
  c2.clearRect(0,0,S,S);
  c2.save();
  var grad=c2.createLinearGradient(0,0,S,S);
  grad.addColorStop(0,'#ffb347');grad.addColorStop(0.55,'#ff8c42');grad.addColorStop(1,'#e8590c');
  // Eine durchgehende Fluegelflaeche: breit & rund, leichte Taille am Koerper
  c2.fillStyle=grad;c2.strokeStyle='#33221b';c2.lineWidth=12;c2.lineJoin='round';
  c2.beginPath();
  c2.moveTo(12,132);
  c2.bezierCurveTo(30,52,120,10,178,34);
  c2.bezierCurveTo(212,50,222,76,204,96);
  c2.bezierCurveTo(224,108,224,150,196,178);
  c2.bezierCurveTo(164,214,96,232,52,214);
  c2.bezierCurveTo(18,198,6,164,12,132);
  c2.closePath();c2.fill();c2.stroke();
  // Innere Trennlinie Vorder-/Hinterfluegel (dezent)
  c2.lineWidth=4;c2.strokeStyle='rgba(51,34,27,0.55)';
  c2.beginPath();c2.moveTo(14,136);c2.bezierCurveTo(70,120,130,116,196,104);c2.stroke();
  // Adern (von der Fluegelwurzel ausgehend)
  c2.lineWidth=3;c2.strokeStyle='rgba(51,34,27,0.75)';
  var veins=[[16,134,150,32],[16,134,190,60],[16,134,208,86],[16,134,210,120],[16,134,196,164],[16,134,160,206],[16,134,110,222],[16,134,54,206]];
  for(var v=0;v<veins.length;v++){c2.beginPath();c2.moveTo(veins[v][0],veins[v][1]);c2.lineTo(veins[v][2],veins[v][3]);c2.stroke();}
  // Weisse Punkte am dunklen Rand (Monarch)
  c2.fillStyle='rgba(255,255,255,0.95)';
  var dots=[[190,30],[208,52],[216,78],[206,104],[210,132],[196,166],[168,200],[130,222],[88,218],[52,196]];
  for(var d=0;d<dots.length;d++){c2.beginPath();c2.arc(dots[d][0],dots[d][1],5,0,6.3);c2.fill();}
  c2.restore();
  var t=new V.CanvasTexture(cv);t.encoding=V.sRGBEncoding;t.anisotropy=4;
  return t;
}
var B=new V.Group();B.rotation.order='YXZ';
var bodyMat=new V.MeshStandardMaterial({color:0x2b1a12,roughness:0.7});
var body=new V.Mesh(new V.CylinderGeometry(0.07,0.10,0.95,7),bodyMat);
body.rotation.x=Math.PI/2;B.add(body);
var head=new V.Mesh(new V.SphereGeometry(0.12,8,6),bodyMat);head.position.z=0.56;B.add(head);
var antGeo=new V.CylinderGeometry(0.008,0.015,0.48,4);
for(var s2=-1;s2<=1;s2+=2){
  var ant=new V.Mesh(antGeo,bodyMat);
  ant.position.set(0.09*s2,0.10,0.66);
  ant.rotation.set(-1.05,0,-0.7*s2);
  B.add(ant);
}
var wtex=wingTexture();
var wingMat=new V.MeshStandardMaterial({map:wtex,alphaTest:0.35,side:V.DoubleSide,roughness:0.85});
var wingGeo=new V.PlaneGeometry(2.3,1.65);
wingGeo.rotateX(Math.PI/2);
wingGeo.translate(1.15,0,0);
var pivotR=new V.Group(),pivotL=new V.Group();
var wingR=new V.Mesh(wingGeo,wingMat);
var wingL=new V.Mesh(wingGeo,wingMat);wingL.scale.x=-1;
pivotR.add(wingR);pivotL.add(wingL);
B.add(pivotR);B.add(pivotL);
B.scale.setScalar(1.25);
B.castShadow=true;
scene.add(B);

/* ---------- Steuerung ---------- */
var st={yaw:Math.PI,pitch:0,yawRate:0,pos:new V.Vector3(0,gH(0,12)+3.2,12)};
var joy={active:false,id:-1,sx:0,sy:0,x:0,y:0};
var keys={};
var hintShown=true,started=false,finished=false,elapsed=0,score=0;
var hudEl=document.getElementById('hud'),hintEl=document.getElementById('hint');

function hideHint(){if(hintShown){hintShown=false;hintEl.style.opacity='0';}}
function ensureAC(){try{ if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();} if(AC.state==='suspended')AC.resume(); }catch(e){}}
var AC=null;
canvas.addEventListener('pointerdown',function(e){
  joy.active=true;joy.id=e.pointerId;joy.sx=e.clientX;joy.sy=e.clientY;joy.x=0;joy.y=0;
  hideHint();ensureAC();started=true;
});
window.addEventListener('pointermove',function(e){
  if(!joy.active||e.pointerId!==joy.id)return;
  var R=95;
  joy.x=V.MathUtils.clamp((e.clientX-joy.sx)/R,-1,1);
  joy.y=V.MathUtils.clamp((e.clientY-joy.sy)/R,-1,1);
});
window.addEventListener('pointerup',function(e){if(e.pointerId===joy.id){joy.active=false;joy.x=0;joy.y=0;}});
window.addEventListener('pointercancel',function(){joy.active=false;joy.x=0;joy.y=0;});
window.addEventListener('keydown',function(e){keys[e.code]=true;hideHint();ensureAC();started=true;});
window.addEventListener('keyup',function(e){keys[e.code]=false;});
window.addEventListener('contextmenu',function(e){e.preventDefault();});
document.getElementById('again').addEventListener('click',function(){location.reload();});
window.addEventListener('resize',function(){
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

/* ---------- Sound ---------- */
function ding(f){
  try{
    if(!AC)return;
    var o=AC.createOscillator(),g=AC.createGain();
    o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.16,AC.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+0.38);
    o.connect(g);g.connect(AC.destination);
    o.start();o.stop(AC.currentTime+0.42);
  }catch(e){}
}
var ladder=[523,587,659,784,880,1047,1175,1319,1568,2093];

/* ---------- HUD ---------- */
function updHUD(){
  hudEl.innerHTML='🌸 '+score+' / '+TARGETS+' &nbsp;·&nbsp; ⏱️ '+Math.floor(elapsed)+' s';
  if(finished){
    document.getElementById('winTime').textContent='Deine Zeit: '+elapsed.toFixed(1).replace('.',',')+' s';
    document.getElementById('win').style.display='flex';
    try{ding(523);setTimeout(function(){ding(659);},140);setTimeout(function(){ding(784);},280);setTimeout(function(){ding(1047);},430);}catch(e){}
  }
}

/* ---------- Animation ---------- */
var clock=new V.Clock();
var flapT=0,lookAt=new V.Vector3(),camGoal=new V.Vector3(),flat=new V.Vector3();
camera.position.set(st.pos.x,st.pos.y+3,st.pos.z+8);

function angDiff(a){return Math.atan2(Math.sin(a),Math.cos(a));}

function take(c){
  c.taken=true;c.group.visible=false;
  score++;ding(ladder[Math.min(score-1,ladder.length-1)]);
  sparkle(c.center.clone().add(new V.Vector3(0,0.4,0)));
  if(score>=TARGETS){finished=true;}
  updHUD();
}

function animate(){
  requestAnimationFrame(animate);
  window.__frames++;
  var dt=Math.min(clock.getDelta(),0.05);
  var time=clock.elapsedTime;
  if(started&&!finished)elapsed+=dt;
  var frozen=window.__freeze!==undefined;

  if(!frozen){
  /* Eingabe */
  var kx=0,ky=0;
  if(keys.ArrowLeft||keys.KeyA)kx-=1;
  if(keys.ArrowRight||keys.KeyD)kx+=1;
  if(keys.ArrowUp||keys.KeyW)ky-=1;
  if(keys.ArrowDown||keys.KeyS)ky+=1;
  var inX=V.MathUtils.clamp(joy.x+kx,-1,1);
  var inY=V.MathUtils.clamp(joy.y+ky,-1,1);
  var moving=(Math.abs(inX)>0.03||Math.abs(inY)>0.03);

  /* Fliegen */
  var tYawRate=-inX*2.1;
  st.yawRate+=(tYawRate-st.yawRate)*Math.min(1,dt*6);
  st.yaw+=st.yawRate*dt;
  var tPitch=V.MathUtils.clamp(-inY*0.6,-0.55,0.62);
  st.pitch+=(tPitch-st.pitch)*Math.min(1,dt*4);
  var spd=9.0*(1-st.pitch*0.45);
  var cp=Math.cos(st.pitch);
  var fw=new V.Vector3(Math.sin(st.yaw)*cp,Math.sin(st.pitch),Math.cos(st.yaw)*cp);
  st.pos.addScaledVector(fw,spd*dt);

  /* Grenzen */
  var rh=Math.hypot(st.pos.x,st.pos.z);
  if(rh>235){
    var des=Math.atan2(-st.pos.x,-st.pos.z);
    st.yaw+=angDiff(des-st.yaw)*Math.min(1,(rh-235)/50)*dt*2.2;
    if(rh>265){st.pos.x*=262/rh;st.pos.z*=262/rh;}
  }
  var gy=gH(st.pos.x,st.pos.z)+1.1;
  if(st.pos.y<gy){st.pos.y=gy;if(st.pitch<0.2)st.pitch+=(0.2-st.pitch)*Math.min(1,dt*4);}
  if(st.pos.y>46){st.pos.y=Math.min(st.pos.y,47);if(st.pitch>-0.05)st.pitch+=(-0.05-st.pitch)*Math.min(1,dt*4);}

  /* Körper */
  var bob=frozen?0:Math.sin(time*3.1)*0.15;
  B.position.set(st.pos.x,st.pos.y+bob,st.pos.z);
  B.rotation.y=st.yaw;
  B.rotation.x=-st.pitch*0.75;
  B.rotation.z=V.MathUtils.clamp(-st.yawRate*0.32,-0.62,0.62);

  /* Flügelschlag */
  flapT+=dt*(moving?17:8);
  var amp=(moving?1.0:0.6)+0.1*Math.sin(time*0.9);
  var ang=Math.sin(flapT)*amp+0.12;
  pivotR.rotation.z=(ang+0.55);
  pivotL.rotation.z=-(ang+0.55);
  }

  /* Kamera (3rd Person) */
  flat.set(Math.sin(st.yaw),0,Math.cos(st.yaw));
  if(!frozen){
  camGoal.copy(B.position).addScaledVector(flat,-7.2);
  camGoal.y=B.position.y+2.6-st.pitch*2.0;
  var gy2=gH(camGoal.x,camGoal.z)+1.2;
  if(camGoal.y<gy2)camGoal.y=gy2;
  camera.position.lerp(camGoal,1-Math.pow(0.0012,dt));
  lookAt.copy(B.position).addScaledVector(flat,4.0);lookAt.y+=0.6;
  camera.lookAt(lookAt);
  }

  /* Sonne folgen */
  sunL.position.copy(B.position).addScaledVector(sunDir,90);
  sunL.target.position.copy(B.position);

  /* Wolken driften */
  for(var ci=0;ci<clouds.length;ci++){
    clouds[ci].position.x+=dt*(1.1+ci*0.08);
    if(clouds[ci].position.x>220)clouds[ci].position.x=-220;
  }

  /* Blumen wiegen (Köpfe) */
  for(var fi=0;fi<FLOWER_N;fi++){
    var fb=fBase[fi];
    var sw=Math.sin(time*1.6+fb.ph)*0.06;
    dummy.position.set(fb.x+sw,fb.h+0.56*fb.s,fb.z);
    dummy.rotation.set(sw,fb.ph,sw*0.7);
    dummy.scale.setScalar(fb.s);
    dummy.updateMatrix();
    heads.setMatrixAt(fi,dummy.matrix);
  }
  heads.instanceMatrix.needsUpdate=true;

  /* Sammel-Blüten pulsen */
  for(var gi=0;gi<collectibles.length;gi++){
    var c=collectibles[gi];
    if(c.taken)continue;
    c.head.position.y=1.0+Math.sin(time*2+gi)*0.05;
    c.spr.material.opacity=0.5+0.3*Math.sin(time*3+c.ph);
    c.spr.scale.setScalar(1.8+0.25*Math.sin(time*3+c.ph));
    if(c.center.distanceToSquared(B.position)<2.3*2.3)take(c);
  }

  /* Funken */
  for(var si=sparks.length-1;si>=0;si--){
    var sp=sparks[si];
    sp.life-=dt;
    sp.s.position.addScaledVector(sp.v,dt);
    sp.v.y+=1.2*dt;
    sp.s.material.opacity=Math.max(sp.life,0);
    if(sp.life<=0){scene.remove(sp.s);sp.s.material.dispose();sparks.splice(si,1);}
  }

  renderer.render(scene,camera);
}
updHUD();
animate();

/* Test-/Debug-API */
window.__game={
  st:st,
  B:B,pivR:pivotR,pivL:pivotL,wingMat:wingMat,scene:scene,camera:camera,
  score:function(){return score;},
  collectibles:collectibles.map(function(c){return c.center;}),
  takeFirst:function(){var c=collectibles.filter(function(q){return!q.taken;})[0];if(c){st.pos.copy(c.center);}}
};
})();
</script>
